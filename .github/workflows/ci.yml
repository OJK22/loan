name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Run ESLint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint

      - name: Run tests
        if: always() && steps.install.outcome == 'success'
        run: npm test

      - name: Build production bundle
        if: always() && steps.install.outcome == 'success'
        run: npm run build
